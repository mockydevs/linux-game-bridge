name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --locked && cargo build --locked --release
      - run: python3 packaging/licenses.py > THIRD_PARTY_NOTICES.txt
      - run: ./packaging/package.sh target/release/linux-game-bridge dist
      - name: Publish alpha packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.deb dist/SHA256SUMS --prerelease --title "Linux Game Bridge $RELEASE_TAG (alpha)" --generate-notes
