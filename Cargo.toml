[package]
name = "linux-game-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unofficial Linux setup and update assistant for official TruckersMP"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
keyvalues-parser = "0.2"
md5 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[dev-dependencies]

[profile.release]
strip = true
lto = "thin"
